<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectando al Servidor Seguro</title>
    <style>
        /* Estilos generales con fuente corporativa limpia */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9; /* Gris corporativo muy suave */
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Tarjeta principal */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            text-align: center;
            border-top: 4px solid #0f4c81; /* Azul marino empresarial */
        }

        /* Contenedor del spinner y escudo */
        .loader-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anillo giratorio */
        .spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #0f4c81;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Icono de candado/seguridad en el centro */
        .lock-icon {
            width: 24px;
            height: 24px;
            fill: #0f4c81;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Textos */
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Barra de progreso sutil */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #0f4c81;
            border-radius: 999px;
            animation: fillProgress 5s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Pie de tarjeta con contador */
        .status-footer {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        .countdown {
            color: #0f4c81;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="loader-wrapper">
            <div class="spinner"></div>
            <!-- Icono SVG de candado -->
            <svg class="lock-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>

        <h1>Por favor, espere</h1>
        <p>Estamos conectando con el servidor seguro.<br>Este proceso tomará solo un momento.</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="status-footer">
            Redirigiendo en <span id="seconds" class="countdown">5</span> segundos...
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('seconds');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownEl.textContent = timeLeft;
            }
            if (timeLeft === 0) {
                clearInterval(timer);
                // Aquí puedes colocar la URL a la que deseas redirigir al terminar:
                window.location.href = "https://clickparavanzar-3.jimdosite.com/";
            }
        }, 1000);
    </script>

</body>
</html>
